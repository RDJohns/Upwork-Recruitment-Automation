version: '3.8'

services:
  kestra:
    image: kestra/kestra:latest
    ports:
      - "8080:8080"
    environment:
      - KESTRA_CONFIGURATION_PATH=/app/kestra.yml
    volumes:
      - ./kestra/config:/app
      - ./src:/app/src
      - ./workflows:/app/workflows
      - ./logs:/app/logs
    command: server standalone
    depends_on:
      - postgres
    networks:
      - kestra-network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: kestra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - kestra-network

volumes:
  postgres_data:

networks:
  kestra-network:
    driver: bridge
